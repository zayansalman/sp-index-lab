name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python (lint + type + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (including dev)
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src scripts tests

      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing -m "not slow"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # Colour must come from design tokens, never from arbitrary Tailwind
      # values. Raw hexes cannot be re-themed, which is why the dark palette
      # was unpickable from the components. The count is zero — keep it there.
      # Chart colours live in lib/chartTheme.ts because Recharts holds them
      # in props that Tailwind cannot reach.
      - name: Check for hardcoded colour literals
        working-directory: frontend
        run: |
          if grep -rn --include='*.tsx' -E '(border|bg|text|fill|stroke|from|to|via)-\[#' \
               app components lib hooks; then
            echo "::error::Hardcoded colour literals found — use design tokens (app/globals.css) or lib/chartTheme.ts."
            exit 1
          fi
          echo "No hardcoded colour literals found."

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

